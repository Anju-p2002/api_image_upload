<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Data</title>

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial;
            padding:40px;
        }

        .container{
            width:90%;
            margin:auto;
        }

        .card-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .card-body{
            padding:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>API Data Display</h1>

    <div class="card-container">

        {% for i in data %}

        <div class="card">

            <img src="{{ i.image }}" alt="">

            <div class="card-body">

                <h2>{{ i.name }}</h2>

                <p>{{ i.description }}</p>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
