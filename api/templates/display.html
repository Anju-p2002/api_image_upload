<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Data</title>

    <style>
        body {
            background: #f4f4f4;
            font-family: Arial;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        button {
            background: red;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>API Data Display</h1>

        <div class="card-container">

            {% for i in data %}

            <div class="card">

                <img src="{{ i.image }}" alt="">

                <div class="card-body">

                    <h2>{{ i.name }}</h2>

                    <p>{{ i.description }}</p>

                    <button onclick="deleteData({{ i.id }})">
                        Delete
                    </button>

                    <button onclick="updateData({{ i.id }})">
                        Update
                    </button>
                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <script>

        function getCookie(name) {

            let cookieValue = null;

            if (document.cookie && document.cookie !== '') {

                const cookies = document.cookie.split(';');

                for (let i = 0; i < cookies.length; i++) {

                    const cookie = cookies[i].trim();

                    if (cookie.substring(0, name.length + 1) === (name + '=')) {

                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                        break;

                    }

                }

            }

            return cookieValue;

        }

        function deleteData(id) {

            const csrftoken = getCookie('csrftoken');

            fetch(`http://127.0.0.1:8000/api/images/${id}/`, {

                method: 'DELETE',

                headers: {
                    'X-CSRFToken': csrftoken
                }

            })

                .then(response => {

                    if (response.status === 204) {

                        alert("Deleted Successfully");

                        location.reload();

                    }

                    else {

                        alert("Delete Failed");

                    }

                })

                .catch(error => console.log(error));

        }

    </script>
    <script>

        function getCookie(name) {

            let cookieValue = null;

            if (document.cookie && document.cookie !== '') {

                const cookies = document.cookie.split(';');

                for (let i = 0; i < cookies.length; i++) {

                    const cookie = cookies[i].trim();

                    if (cookie.substring(0, name.length + 1) === (name + '=')) {

                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                        break;

                    }

                }

            }

            return cookieValue;

        }

        function updateData(id) {

            const csrftoken = getCookie('csrftoken');

            fetch(`http://127.0.0.1:8000/api/images/${id}/`, {

                method: 'PATCH',

                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },

                // body: JSON.stringify({

                //     name: "New Updated Name",

                //     description: "New Updated Description"

                // })

            })

                .then(response => {

                    if (response.ok) {

                        alert("Updated Successfully");

                        location.reload();

                    } else {

                        alert("Update Failed");

                    }

                })

                .catch(error => console.log(error));

        }

    </script>


</body>

</html>
